name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  command-center:
    name: Command center — typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/command-center

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/command-center/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Production build
        run: npm run build

  smoke:
    name: Command center — smoke test
    runs-on: ubuntu-latest
    needs: command-center
    defaults:
      run:
        working-directory: apps/command-center

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/command-center/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Start server
        run: |
          nohup npm run start -- -p 3001 > /tmp/next-start.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3001/ > /dev/null; then exit 0; fi
            sleep 2
          done
          echo "Server did not start in time" && exit 1

      - name: Run smoke checks
        env:
          SMOKE_BASE_URL: http://127.0.0.1:3001
        run: npm run smoke
